[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sdlc"
version = "1.0.0"
description = "Governed, graph-based agentic SDLC orchestrator, demonstrated by building a URL shortener service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    # The orchestrator verifies agent output by running the generated service's
    # test-suite, so the service's runtime and test dependencies live here too.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
# Only needed for live mode (--provider anthropic). Scripted mode is offline.
llm = ["anthropic>=0.40"]

[project.scripts]
sdlc = "agentic_sdlc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sdlc"]

[tool.ruff]
line-length = 120
# Playbook change sets and the generated service are pipeline inputs/outputs:
# they are replayed and compared byte-for-byte, so tools must not rewrite them.
extend-exclude = ["playbooks", "service", "demo", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
